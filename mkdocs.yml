site_name: Amp Panel Documentation
site_description: User manual, administration guide, and technical reference for Amp Panel
docs_dir: docs
site_dir: site

theme:
  name: mkdocs

nav:
  - Home: index.md
  - Manuals:
      - Quick start: manual/quick-start.md
      - Operator: manual/operator.md
      - FTS-LS station: manual/fts-ls.md
      - Administrator: manual/administrator.md
  - Installation and operations:
      - Installation: operations/installation.md
      - Configuration: operations/configuration.md
      - amp-panel CLI: operations/cli.md
      - Backup and data migration: operations/backup.md
      - Troubleshooting: operations/troubleshooting.md
  - Technical documentation:
      - Architecture: technical/architecture.md
      - HTTP API: technical/http-api.md
      - Database: technical/database.md
      - Device protocols: technical/protocols.md
      - Security: technical/security.md
      - Integrations: technical/integrations.md
  - Development:
      - Environment and tests: development.md
      - Python API: api.md
  - Reference:
      - Configuration variables: reference/configuration.md
      - Roles and permissions: reference/roles.md
      - Glossary: reference/glossary.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            members_order: source

markdown_extensions:
  - tables
  - toc:
      permalink: true
